events {}
http {
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    server {
        listen 80;    
        server_name  app-front-end;
        #listen 443;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}